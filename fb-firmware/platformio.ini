[platformio]
default_envs = fb

[env:fb]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_98:88:E0:72:C1:0C-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_98:88:E0:72:C1:0C-if00

; OTA-taugliche Partitionstabelle ab dem ersten Flash.
; Die Partitionstabelle laesst sich NUR per USB aendern, nicht per OTA — wer mit
; Single-App-Layout flasht und das Gehaeuse zuschraubt, kommt nie mehr auf OTA.
; default.csv = 2x 1.25MB App-Slots + otadata bei 4MB Flash.
board_build.partitions = default.csv

build_flags =
    -I../shared
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Keine Log-Ausgaben des Arduino-Cores (log_e & Co.): log_printfv() wartet
    ; danach ohne Timeout, bis UART0 fertig gesendet hat — am 2026-09-26 hing
    ; die FB darin nach einem I2C-Lesefehler fuer immer fest. Eigene Meldungen
    ; laufen ueber Serial (USB) und sind nicht betroffen.
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ADS1X15 @ ^2.5.0
    adafruit/Adafruit NeoPixel @ ^1.12.0

; FB-Board V2: Gelb GPIO5, Display-MOSI GPIO6, Status-LED GPIO16 (siehe FB_REV
; in main.cpp). Flashen: pio run -e fb_v2 -t upload --upload-port ...
[env:fb_v2]
extends = env:fb
build_flags =
    ${env:fb.build_flags}
    -DFB_REV=2

; Testbuild ohne I2C-Verkehr — prueft, ob der SYSTIMER-Fehler des ESP32-C6
; rev v0.2 (Uhr-Ruecksprung, Interrupt-WDT) ohne I2C ausbleibt.
; Flashen: pio run -e fb_noi2c -t upload
[env:fb_noi2c]
extends = env:fb
build_flags =
    ${env:fb.build_flags}
    -DMK_TEST_NO_I2C

; Testbuild: nacktes C6 ohne FB-Platine (Versorgung per USB). Akku-Messung aus,
; Direct Mode fest. Flashen: pio run -e fb_bare -t upload
[env:fb_bare]
extends = env:fb
build_flags =
    ${env:fb.build_flags}
    -DMK_TEST_BARE

; Testbuild: C6 auf der Platine, Akku ab, Versorgung per USB. Akku-Messung aus.
; Flashen: pio run -e fb_usbpower -t upload
[env:fb_usbpower]
extends = env:fb
build_flags =
    ${env:fb.build_flags}
    -DMK_TEST_USB_POWER

; Testbuild: wie fb_usbpower, zusaetzlich WS2812B dauerhaft aus.
[env:fb_usbpower_noled]
extends = env:fb
build_flags =
    ${env:fb.build_flags}
    -DMK_TEST_USB_POWER
    -DMK_TEST_NO_LED

; Testbuild: wie fb_usbpower, Display-SPI mit 10 statt 40 MHz.
[env:fb_usbpower_spi10]
extends = env:fb
build_flags =
    ${env:fb.build_flags}
    -DMK_TEST_USB_POWER
    -DMK_TEST_SPI_10MHZ
