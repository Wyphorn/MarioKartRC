[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_resetmethod = nodemcu
upload_speed = 115200

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ADS1X15 @ ^2.5.0
    adafruit/Adafruit NeoPixel @ ^1.12.0
