[platformio]
default_envs = car

[env:car]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_14:C1:9F:E4:B9:24-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_14:C1:9F:E4:B9:24-if00

build_flags =
    -I../shared
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Keine Log-Ausgaben des Arduino-Cores (log_e & Co.): log_printfv() wartet
    ; danach ohne Timeout, bis UART0 fertig gesendet hat — am 2026-09-26 hing
    ; die FB darin nach einem I2C-Lesefehler fuer immer fest. Eigene Meldungen
    ; laufen ueber Serial (USB) und sind nicht betroffen.
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    dfrobot/DFRobotDFPlayerMini @ ^1.0.6

; Kart-Board V2: LED/IR und RPWM/LPWM getauscht (siehe KART_REV in main.cpp).
; Flashen: pio run -e car_v2 -t upload
[env:car_v2]
extends = env:car
build_flags =
    ${env:car.build_flags}
    -DKART_REV=2

; Update über WLAN (OTA): Auto per FB-Menü "Firmware-Update → Auto" in den Update-Modus
; schicken, dann mit dem Hostnamen, den die FB anzeigt:
;   pio run -e car_ota    -t upload --upload-port kart-mario-b924.local   (Board V1)
;   pio run -e car_v2_ota -t upload --upload-port kart-mario-b924.local   (Board V2)
; Ablauf: OTA-Abschnitt in shared/mk_protocol.h. WLAN-Daten: shared/mk_secrets.h
; Das Auto holt die Firmware per TCP vom PC ab, fest auf Port 3233. Die
; PC-Firewall muss das einmalig erlauben, z.B. bei ufw:
;   sudo ufw allow proto tcp from 192.168.178.0/24 to any port 3233
[env:car_ota]
extends = env:car
upload_protocol = espota
upload_flags = --host_port=3233
upload_port =
monitor_port =

[env:car_v2_ota]
extends = env:car_v2
upload_protocol = espota
upload_flags = --host_port=3233
upload_port =
monitor_port =

; Testbuild ohne I2C-Verkehr — prueft, ob der SYSTIMER-Fehler des ESP32-C6
; rev v0.2 (Uhr-Ruecksprung, Interrupt-WDT) ohne I2C ausbleibt.
; Flashen: pio run -e car_noi2c -t upload
[env:car_noi2c]
extends = env:car
build_flags =
    ${env:car.build_flags}
    -DMK_TEST_NO_I2C

; Testbuild: Verbindung normal, Motor und Servo bleiben aus.
; Flashen: pio run -e car_nodrive -t upload
[env:car_nodrive]
extends = env:car
build_flags =
    ${env:car.build_flags}
    -DMK_TEST_NO_DRIVE
